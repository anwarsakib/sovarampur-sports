<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>শোভারামপুর স্পোর্টস ফ্যামিলি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0e9f4f; --green-d:#0b7a3e; --green-dd:#065f46;
  --navy:#0f172a; --bg:#eef2f6; --card:#fff; --line:#e2e8f0;
  --txt:#1e293b; --mut:#64748b; --gold:#f59e0b; --red:#dc2626; --blue:#0284c7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Hind Siliguri','Noto Sans Bengali','SolaimanLipi',system-ui,sans-serif;background:#d8e0e8;color:var(--txt)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}
#shell{max-width:540px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(15,23,42,.18)}
/* ===== header ===== */
header{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--green-dd),var(--green-d) 55%,var(--green));color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 2px 10px rgba(6,95,70,.35)}
.hlogo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden;flex:none}
.hlogo img{width:100%;height:100%;object-fit:cover}
.htitle{flex:1;min-width:0}
.htitle h1{font-size:1.02rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle p{font-size:.74rem;opacity:.85;line-height:1.2}
.hbtn{width:38px;height:38px;border:none;border-radius:11px;background:rgba(255,255,255,.16);color:#fff;font-size:1.1rem;flex:none;display:flex;align-items:center;justify-content:center}
.hbtn:active{background:rgba(255,255,255,.32)}
/* ===== main ===== */
#view{padding:14px 14px 100px}
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#065f46,#0e9f4f 65%,#22c55e);color:#fff;padding:20px 18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(6,95,70,.32)}
.hero .ball{position:absolute;font-size:6.5rem;opacity:.13;right:-12px;bottom:-24px;transform:rotate(-15deg);pointer-events:none}
.hero h2{font-size:1.42rem;line-height:1.3;position:relative}
.hero .vil{opacity:.92;font-size:.85rem;margin-top:3px;position:relative}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative}
.hero .tags span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:3px 10px;border-radius:999px;font-size:.72rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.stat{border-radius:16px;padding:12px 14px;color:#fff;box-shadow:0 3px 10px rgba(15,23,42,.12)}
.stat .lb{font-size:.74rem;opacity:.92}
.stat .vl{font-size:1.28rem;font-weight:700;margin-top:2px;line-height:1.2}
.stat.bal{background:linear-gradient(135deg,#065f46,#0e9f4f)}
.stat.inc{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.stat.exp{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.stat.mem{background:linear-gradient(135deg,#92400e,#f59e0b)}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(15,23,42,.06);border:1px solid var(--line);margin-bottom:12px}
.shead{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px;gap:8px}
.shead h3{font-size:.98rem;color:var(--navy);display:flex;align-items:center;gap:6px}
.shead .lnk{background:none;border:none;color:var(--green-d);font-weight:600;font-size:.8rem;white-space:nowrap}
/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:10px 16px;font-size:.9rem;font-weight:600;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green-d);color:#fff}
.btn.gold{background:var(--gold);color:#3b2606}
.btn.dark{background:#0f172a;color:#fff}
.btn.red{background:#fee2e2;color:var(--red)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:9px}
.btn.blk{width:100%}
.ibtn{background:#f1f5f9;border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:.75rem;color:var(--txt);line-height:1.3}
.ibtn:active{background:#e2e8f0}
/* ===== chips / filters ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:.82rem;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--green-d);border-color:var(--green-d);color:#fff;font-weight:600}
.ckbox{border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;font-size:.84rem;background:#f8fafc;flex:1;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ckbox.on{background:#dcfce7;border-color:var(--green);color:var(--green-dd);font-weight:600}
/* ===== members ===== */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 1px 4px rgba(15,23,42,.05)}
.mcard:active{transform:scale(.98)}
.ava{width:66px;height:66px;border-radius:50%;margin:0 auto 8px;object-fit:cover;border:3px solid #dcfce7;background:#f0fdf4;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--green-d)}
.mcard .nm{font-weight:600;font-size:.9rem;line-height:1.25}
.mcard .sp{display:flex;justify-content:center;gap:4px;margin-top:6px;font-size:.8rem;flex-wrap:wrap}
.spbadge{background:#f1f5f9;border-radius:8px;padding:2px 7px}
/* ===== rows / lists ===== */
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.ric{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none}
.ric.in{background:#dcfce7}.ric.out{background:#fee2e2}
.rmain{flex:1;min-width:0}
.rmain .t{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain .s,.tsub{font-size:.72rem;color:var(--mut);margin-top:2px;line-height:1.4}
.ramt{font-weight:700;font-size:.92rem;white-space:nowrap}
.ramt.in{color:#15803d}.ramt.out{color:var(--red)}
/* ===== tables / bars ===== */
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{background:#f0fdf4;color:var(--green-dd);padding:8px 4px;text-align:center;font-weight:600;border-bottom:2px solid #bbf7d0;font-size:.72rem}
.tbl td{padding:8px 4px;text-align:center;border-bottom:1px solid #f1f5f9}
.tbl td.l,.tbl th.l{text-align:left}
.tbl tr.me td{background:#f0fdf4;font-weight:600}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#22c55e);border-radius:99px}
.bar.gld i{background:linear-gradient(90deg,#d97706,#fbbf24)}
/* ===== notices ===== */
.ncard{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(15,23,42,.05)}
.ncard.imp{border-left-color:var(--gold)}
.ncard.urg{border-left-color:var(--red)}
.nttl{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nbody{font-size:.86rem;margin-top:6px;line-height:1.55;color:#334155;word-break:break-word}
.nmeta{font-size:.72rem;color:var(--mut);margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pri-chip{font-size:.68rem;padding:2px 8px;border-radius:99px;color:#fff;font-weight:600;flex:none}
.new{background:#fee2e2;color:var(--red);font-size:.66rem;padding:2px 8px;border-radius:99px;font-weight:700;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
/* ===== tournament ===== */
.tcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(15,23,42,.06);margin-bottom:12px}
.temoji{width:46px;height:46px;border-radius:13px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none;border:1px solid #bbf7d0}
.tnm{font-weight:700;font-size:.98rem;line-height:1.3}
.stchip{font-size:.7rem;padding:3px 10px;border-radius:99px;flex:none;font-weight:600;background:#f1f5f9;color:var(--mut)}
.stchip.live{background:#dcfce7;color:#15803d}
.champbox{margin-top:12px;background:linear-gradient(135deg,#78350f,#f59e0b);color:#fff;border-radius:13px;padding:12px;text-align:center;font-size:.88rem;line-height:1.5}
.champline{margin-top:9px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:7px 10px;font-size:.82rem;color:#92400e}
.rnd{background:#ecfdf5;color:#047857;border:1px solid #bbf7d0;font-size:.68rem;padding:2px 8px;border-radius:99px;font-weight:600}
.vs{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;flex-wrap:wrap}
.vs .win{color:#15803d;text-decoration:underline;text-decoration-color:#86efac}
.score{background:#f1f5f9;border-radius:8px;padding:2px 10px;font-weight:700;font-size:.85rem;flex:none}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;padding:8px 4px;border-radius:9px;font-size:.8rem;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button.on{background:#fff;color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* ===== empty / setup ===== */
.empty{text-align:center;padding:34px 16px;color:var(--mut);font-size:.88rem}
.empty .e{font-size:2.6rem;display:block;margin-bottom:8px}
.setup{padding:26px 20px 40px;text-align:center}
.setup .big{font-size:3.4rem}
.setup h2{color:var(--green-dd);margin:8px 0 4px}
/* ===== modal ===== */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:18px 16px;max-height:88vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(46px);opacity:.4}to{transform:none;opacity:1}}
.mhandle{width:44px;height:5px;background:#e2e8f0;border-radius:99px;margin:0 auto 14px}
@media(min-width:600px){.mback{align-items:center}.modal{border-radius:22px}}
.mttl{font-size:1.05rem;color:var(--navy);margin-bottom:12px}
.mtxt{font-size:.84rem;color:#475569;line-height:1.55}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns .btn{flex:1}
/* ===== forms ===== */
.fgrp{margin-bottom:12px;text-align:left}
.fgrp label{display:block;font-size:.8rem;font-weight:600;color:var(--navy);margin-bottom:5px}
.fgrp input,.fgrp select,.fgrp textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#f8fafc;outline:none}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{border-color:var(--green);background:#fff}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ===== bottom nav ===== */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;background:#fff;display:flex;border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(15,23,42,.07)}
nav.bottom button{flex:1;background:none;border:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:.66rem}
nav.bottom button .ic{font-size:1.25rem;line-height:1}
nav.bottom button.on{color:var(--green-d);font-weight:700}
nav.bottom button.on .ic{transform:translateY(-2px) scale(1.1)}
/* ===== toast ===== */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:400px}
.tmsg{background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:pop .25s;max-width:92%;text-align:center}
.tmsg.ok{background:#15803d}.tmsg.err{background:var(--red)}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
/* ===== guide ===== */
.acc{border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:#fff;overflow:hidden}
.acc>button{width:100%;text-align:left;background:none;border:none;padding:12px 14px;font-size:.9rem;font-weight:600;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc>div{padding:0 14px 13px;font-size:.85rem;line-height:1.6;color:#334155;display:none;border-top:1px dashed var(--line);padding-top:10px;margin-top:-1px}
.acc.open>div{display:block}
.gmtxt{padding:0 14px 13px;font-size:.85rem;line-height:1.6;color:#334155}
/* ==================== v2: অ্যানিমেশন • স্প্ল্যাশ • ব্যানার • কাউন্টডাউন ==================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#view>*{animation:fadeUp .4s both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}
#view>*:nth-child(4){animation-delay:.15s}#view>*:nth-child(5){animation-delay:.2s}
#view>*:nth-child(6){animation-delay:.25s}#view>*:nth-child(7){animation-delay:.3s}
@keyframes spin{to{transform:rotate(360deg)}}
.hlogo{position:relative}
.hlogo::before{content:'';position:absolute;inset:-3px;border-radius:15px;background:conic-gradient(#fbbf24,#22c55e,#fbbf24);animation:spin 6s linear infinite;opacity:.85;z-index:-1}
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#065f46 0%,#0e9f4f 60%,#16a34a 100%);animation:splashOut .5s ease 1.5s both}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes splashPop{0%{transform:scale(.2) rotate(-30deg);opacity:0}55%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.slogo{position:relative;width:118px;height:118px;display:flex;align-items:center;justify-content:center}
.slogo .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#fbbf24,#22c55e,#065f46,#fbbf24);animation:spin 2.4s linear infinite}
.slogo .core{position:absolute;inset:7px;border-radius:50%;background:linear-gradient(135deg,#065f46,#0e9f4f);display:flex;align-items:center;justify-content:center;font-size:3.4rem;box-shadow:inset 0 0 24px rgba(0,0,0,.25);animation:splashPop .9s cubic-bezier(.2,1.4,.4,1) both}
.sname{color:#fff;font-size:1.5rem;font-weight:700;letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.3);animation:fadeUp .7s ease .45s both}
.ssub{color:#d1fae5;font-size:.85rem;animation:fadeUp .7s ease .75s both}
.sball{position:absolute;bottom:12%;font-size:1.9rem;animation:ballhop 1.1s ease-in-out infinite}
@keyframes ballhop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(160deg)}}
.hero .ball{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translate(0,0) rotate(-15deg)}50%{transform:translate(-14px,-16px) rotate(8deg)}}
.banner{position:relative;overflow:hidden;border-radius:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(6,95,70,.25)}
.btrack{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.bslide{min-width:100%;color:#fff;padding:20px 18px;position:relative;overflow:hidden;min-height:128px;display:flex;flex-direction:column;justify-content:center}
.bslide .bemoji{position:absolute;right:-8px;bottom:-16px;font-size:5.4rem;opacity:.16;animation:floaty 6s ease-in-out infinite}
.bslide .bt{font-size:1.12rem;font-weight:700;line-height:1.35;position:relative}
.bslide .bs{font-size:.8rem;opacity:.92;margin-top:4px;position:relative;line-height:1.45}
.bslide .bchip{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px 10px;font-size:.68rem;margin-bottom:7px;width:fit-content;position:relative}
.bg1{background:linear-gradient(120deg,#065f46,#0e9f4f 70%,#22c55e)}
.bg2{background:linear-gradient(120deg,#92400e,#d97706 70%,#fbbf24)}
.bg3{background:linear-gradient(120deg,#1e3a8a,#1d4ed8 70%,#3b82f6)}
.bg4{background:linear-gradient(120deg,#831843,#be185d 70%,#ec4899)}
.bg5{background:linear-gradient(120deg,#0f172a,#334155 70%,#64748b)}
@keyframes shimmer{0%{transform:translateX(-100%) skewX(-18deg)}60%,100%{transform:translateX(220%) skewX(-18deg)}}
.banner::after{content:'';position:absolute;top:0;bottom:0;width:44px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:shimmer 3.6s ease-in-out infinite;pointer-events:none;z-index:2}
.bdots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.bdot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.45);border:none;padding:0;transition:.25s}
.bdot.on{width:20px;background:#fff}
.cdwrap{display:flex;gap:6px;justify-content:center;margin-top:10px}
.cdbox{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:7px 0;width:64px;text-align:center;color:#fff}
.cdbox b{display:block;font-size:1.22rem;line-height:1.15;font-variant-numeric:tabular-nums;animation:pulse1s 1s ease-in-out infinite}
.cdbox span{font-size:.62rem;opacity:.85}
@keyframes pulse1s{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.cdtitle{font-size:.74rem;letter-spacing:1px;color:rgba(255,255,255,.85);text-align:center;margin-top:8px;text-transform:uppercase}
.faceoff{position:relative;background:linear-gradient(120deg,#065f46,#0b7a3e 48%,#1d4ed8 52%,#0284c7);border-radius:18px;padding:18px 14px 14px;color:#fff;margin-bottom:12px;overflow:hidden;box-shadow:0 10px 26px rgba(6,95,70,.3)}
.fo-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;position:relative}
.fo-team{text-align:center;min-width:0}
.fo-team .fem{font-size:1.9rem;display:block;animation:floaty 4.5s ease-in-out infinite}
.fo-team .fn{font-weight:700;font-size:.86rem;margin-top:4px;line-height:1.3;word-break:break-word}
.fo-team .fs{font-size:.66rem;opacity:.85;margin-top:2px}
.fo-avs{display:flex;justify-content:center;margin-top:7px}
.fo-av{width:30px;height:30px;border-radius:50%;border:2px solid #fff;margin-left:-9px;background:#f0fdf4;overflow:hidden;font-size:.66rem;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0b7a3e}
.fo-av:first-child{margin-left:0}
.fo-av img{width:100%;height:100%;object-fit:cover}
.fo-vs{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#fde68a 60%,#f59e0b);color:#78350f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:vsPulse 1.6s ease-in-out infinite;flex:none}
@keyframes vsPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(251,191,36,.55)}50%{transform:scale(1.12);box-shadow:0 0 0 12px rgba(251,191,36,0)}}
.fo-meta{text-align:center;font-size:.74rem;opacity:.92;margin-top:10px;position:relative}
.champbox{position:relative;overflow:hidden}

<script>
'use strict';
/* ================= শোভারামপুর স্পোর্টস ফ্যামিলি — একক ফাইল অ্যাপ ================= */
const LS_KEY='shobarampur_sports_v2';
const SS_KEY='sobarampur_session';
const BN='০১২৩৪৫৬৭৮৯';
const MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const SPORTS={football:{n:'ফুটবল',e:'⚽',u:'গোল'},cricket:{n:'ক্রিকেট',e:'🏏',u:'রান'},badminton:{n:'ব্যাডমিন্টন',e:'🏸',u:'সেট'}};
const DEFAULT_INC_CATS=['মাঠ ফি','মাসিক চাঁদা','অনুদান / দান','টুর্নামেন্ট ফি','অন্যান্য আয়'];
const DEFAULT_EXP_CATS=['মাঠ ভাড়া','বিদ্যুৎ বিল','নেট / বল / সরঞ্জাম','টুর্নামেন্ট খরচ','রেফারি ফি','পানি / ফলমূল','ব্যানার / সাজসজ্জা','অন্যান্য ব্যয়'];
function incCats(){return (store.settings&&store.settings.incCats&&store.settings.incCats.length)?store.settings.incCats:DEFAULT_INC_CATS;}
function expCats(){return (store.settings&&store.settings.expCats&&store.settings.expCats.length)?store.settings.expCats:DEFAULT_EXP_CATS;}
const ROUNDS=['গ্রুপ পর্ব','প্রথম রাউন্ড','কোয়ার্টার ফাইনাল','সেমি-ফাইনাল','তৃতীয় স্থান নির্ধারণী','ফাইনাল'];
const PRI_COL={'সাধারণ':'#0284c7','গুরুত্বপূর্ণ':'#f59e0b','জরুরি':'#dc2626'};
let store=null, view='home', memFilter='all', ledTab='tx', currentT=null, currentTT='match';
window._photo=''; window._logo='';

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const bnNum=x=>String(x).replace(/[0-9]/g,d=>BN[+d]);
function bdt(n){n=Math.round(Number(n)||0);const neg=n<0;n=Math.abs(n);
  let s=String(n),last=s.slice(-3),rest=s.slice(0,-3),p=[];
  while(rest.length>2){p.unshift(rest.slice(-2));rest=rest.slice(0,-2);}
  if(rest)p.unshift(rest);
  return (neg?'-':'')+'৳'+bnNum((p.length?p.join(',')+',':'')+last);}
function fdate(iso){if(!iso)return '—';const a=String(iso).split('-');
  if(a.length<3)return esc(iso);
  return bnNum(+a[2])+' '+MONTHS[(+a[1])-1]+' '+bnNum(+a[0]);}
function ftime(ts){const d=new Date(ts);if(isNaN(d))return '';
  return bnNum(d.getDate())+' '+MONTHS[d.getMonth()]+', '+bnNum(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'))+' ঘটিকা';}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hashPin(p){let h=5381;for(const c of String(p)){h=((h*33)+c.charCodeAt(0))>>>0;}return 'h'+h;}
function daysAgo(iso,n){n=n||3;if(!iso)return false;const t=new Date(iso+'T00:00:00');if(isNaN(t))return false;return (Date.now()-t.getTime())/(864e5)<=n;}
function initials(n){const w=String(n||'').trim().split(/\s+/).slice(0,2);return w.map(x=>x[0]||'').join('')||'?';}

/* ================= store ================= */
function freshStore(){return{
  settings:{clubName:'শোভারামপুর স্পোর্টস ফ্যামিলি',village:'শোভারামপুর',tagline:'স্বচ্ছ হিসাব • সবার ভালোবাসা • নিজের মাঠ',logo:'',
    soundOn:true,incCats:DEFAULT_INC_CATS.slice(),expCats:DEFAULT_EXP_CATS.slice()},
  admins:[],players:[],income:[],expenses:[],tournaments:[],notices:[],notifications:[],log:[]};}
function load(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){toast('ফোনের স্টোরেজ ভরে গেছে! ছবি ছোট করে আবার চেষ্টা করুন।','err');}}

/* ================= নোটিফিকেশন সেন্টার + সাউন্ড ================= */
function unreadCount(){return store.notifications.filter(n=>!n.read).length;}
function notify(title,body,type){store.notifications.unshift({id:uid(),ts:Date.now(),title:title,body:body,type:type||'info',read:false});
  if(store.notifications.length>40)store.notifications.length=40;
  save();updateBell();ding();}
function updateBell(){const b=$('#nbell');if(!b)return;const n=unreadCount();
  b.innerHTML='🔔'+(n?'<span class="nbadge">'+bnNum(n)+'</span>':'');}
function ding(){if(store.settings&&store.settings.soundOn===false)return;
  try{if(!window._actx)window._actx=new (window.AudioContext||window.webkitAudioContext)();
    const c=window._actx;if(c.state==='suspended')c.resume();
    [[659,0],[784,.14],[1047,.28]].forEach(function(nd){
      const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=nd[0];
      o.connect(g);g.connect(c.destination);
      const t0=c.currentTime+nd[1];
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.22,t0+.03);
      g.gain.exponentialRampToValueAtTime(.001,t0+.55);
      o.start(t0);o.stop(t0+.6);});}catch(e){}}
function notifPanel(){const ns=store.notifications;
  openModal(`<div class="mhandle"></div><h3 class="mttl">🔔 নোটিফিকেশন</h3>
  ${ns.length?ns.map(n=>`<div class="nrow ${n.read?'':'un'}">
      <span class="nic">${n.type==='notice'?'📢':n.type==='match'?'⚽':n.type==='result'?'✅':n.type==='champion'?'🏆':'ℹ️'}</span>
      <div><b>${esc(n.title)}</b><div class="tsub">${esc(n.body)}</div><div class="tsub" style="opacity:.7">🕘 ${ftime(n.ts)}</div></div>
    </div>`).join(''):`<div class="card empty"><span class="e">🔕</span>এখনো কোনো নোটিফিকেশন নেই</div>`}
  <div class="mtxt" style="margin-top:8px">💡 অ্যাডমিন নোটিশ দিলে, নতুন ম্যাচ/ফলাফল/চ্যাম্পিয়ন ঘোষণা করলে এখানে নোটিফিকেশন আসবে ও শব্দ বাজবে।</div>
  <div class="mbtns"><button class="btn ghost" onclick="closeModal()">বন্ধ</button><button class="btn pri" onclick="markAllRead()">সব পড়া হয়েছে ✓</button></div>`);
  setTimeout(function(){store.notifications.forEach(n=>n.read=true);save();updateBell();},2500);}
function markAllRead(){store.notifications.forEach(n=>n.read=true);save();updateBell();closeModal();toast('সব নোটিফিকেশন পড়া হয়েছে ✅');}

/* ================= কপি + অ্যাপ ব্যবহারের হিসাব ================= */
function copyText(txt,msg){const done=function(){toast(msg||'কপি হয়েছে 📋');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);done();});}
  else{fallbackCopy(txt);done();}}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}
const US_KEY='shobarampur_usage_v3';
function bumpUsage(){try{const r=JSON.parse(localStorage.getItem(US_KEY)||'null')||{first:Date.now(),opens:0,days:{}};
  r.opens++;r.last=Date.now();const d=todayISO();r.days[d]=(r.days[d]||0)+1;
  localStorage.setItem(US_KEY,JSON.stringify(r));}catch(e){}}
function getUsage(){try{return JSON.parse(localStorage.getItem(US_KEY)||'null');}catch(e){return null;}}
/* ===== সেশন/অথ: মূল এডমিন (জিমেইল) + সহ এডমিন (ইউজারনেম) ===== */
function curSession(){try{return JSON.parse(sessionStorage.getItem(SS_KEY)||'null');}catch(e){return null;}}
function isAdmin(){return !!curSession();}
const ALL_SECS=['ledger','members','tournaments','notices','settings'];
const ADMIN_ROLES={'সব অধিকার':ALL_SECS,'হিসাব':['ledger'],'টুর্নামেন্ট':['tournaments'],'সদস্য':['members'],'নোটিশ':['notices']};
function canAdmin(sec){const s=curSession();if(!s)return false;
  if(s.kind==='main'||s.role==='সব অধিকার')return true;
  const r=ADMIN_ROLES[s.role];return !!(r&&r.indexOf(sec)>-1);}
function setSession(s){if(s)sessionStorage.setItem(SS_KEY,JSON.stringify(s));else sessionStorage.removeItem(SS_KEY);}
function adminName(){const s=curSession();return s?s.name:'অজানা';}
function curAdmin(){return curSession()||{name:'অজানা',role:''};}
/* Firebase Auth (REST) — সহ এডমিনের যেকোনো-ফোন লগইনের জন্য; provider বন্ধ থাকলে লোকাল তালিকাই কাজ করে */
const FB_API_KEY='AIzaSyCy7i1Zw4ZE9yMj4PvZhvlTZbq3g7I4TuI';
const CO_DOMAIN='@shobarampur.app';
function coLocal(u){const s=String(u||'').trim().toLowerCase().replace(/[^a-z0-9._%+-]/g,'');
  return s?s:'u'+hashPin(u).slice(1);}
function fbReq(path,body){return fetch('https://identitytoolkit.googleapis.com/v1/'+path+'?key='+FB_API_KEY,
  {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());}
function fbSignUp(email,pwd){return fbReq('accounts:signUp',{email:email,password:pwd,returnSecureToken:true});}
function fbSignIn(email,pwd){return fbReq('accounts:signInWithPassword',{email:email,password:pwd,returnSecureToken:true});}
function fbProviderOff(m){return String(m||'').indexOf('CONFIGURATION_NOT_FOUND')>-1||String(m||'').indexOf('OPERATION_NOT_ALLOWED')>-1;}
/* ===== শেয়ারড লাইভ টাইমার (Firebase Realtime Database — সবার ফোনে একই ঘড়ি) ===== */
const RTDB_CANDIDATES=['https://shovarampur-sports-default-rtdb.firebaseio.com','https://shovarampur-sports-default-rtdb.asia-southeast1.firebasedatabase.app'];
let RTDB_URL=localStorage.getItem('srf_rtdb_url')||'';
let SHARE=null, SHARE_ANN={};
async function liveGet(){if(RTDB_URL){try{const r=await fetch(RTDB_URL+'/liveTimer.json',{cache:'no-store'});const j=await r.json();
    if(j&&typeof j==='object'&&!j.error)return j;
    if(j&&j.error&&String(j.error).indexOf('404')>-1)return null;}catch(e){}}
  for(const b of RTDB_CANDIDATES){try{const r=await fetch(b+'/liveTimer.json',{cache:'no-store'});const j=await r.json();
    if(j&&typeof j==='object'&&!j.error){RTDB_URL=b;localStorage.setItem('srf_rtdb_url',b);return j;}
    if(j&&j.error&&String(j.error).indexOf('404')>-1)return null;}catch(e){}}
  return null;}
async function livePut(st){if(!RTDB_URL){try{const r=await fetch(RTDB_CANDIDATES[0]+'/.json?shallow=true');const j=await r.json();
    if(!j||!j.error){RTDB_URL=RTDB_CANDIDATES[0];localStorage.setItem('srf_rtdb_url',RTDB_URL);}}catch(e){}}
  if(!RTDB_URL)return false;
  try{const r=await fetch(RTDB_URL+'/liveTimer.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(st)});const j=await r.json();return !(j&&j.error);}catch(e){return false;}}
async function liveSync(){const st=await liveGet();
  SHARE=(st&&st.phase&&st.phase!=='idle')?st:null;renderShareBar();}
function sharePhaseLabel(){return {h1:'প্রথমার্ধ',h1p:'প্রথমার্ধ (থামানো)',rest:'বিরতি',restp:'বিরতি (থামানো)',h2:'দ্বিতীয়ার্ধ',h2p:'দ্বিতীয়ার্ধ (থামানো)',done:'খেলা শেষ'}[SHARE.phase]||'';}
function renderShareBar(){let bar=document.getElementById('sharebar');
  if(!SHARE){if(bar)bar.remove();return;}
  if(!bar){bar=document.createElement('div');bar.id='sharebar';bar.onclick=function(){openTimer(SHARE.tourId);};document.body.appendChild(bar);}
  const left=Math.max(0,Math.ceil((SHARE.endAt-Date.now())/1000));
  bar.innerHTML='📡 লাইভ খেলা চলছে — '+sharePhaseLabel()+' <b>'+bnTime(left)+'</b>'+(SHARE.matchName?' <span style="opacity:.85">('+esc(SHARE.matchName)+')</span>':'')+'<span class="sb2">'+esc(SHARE.by||'অ্যাডমিন')+' চালু করেছেন • চাপ দিলে ঘড়ি খুলবে</span>';}
function shareTick(){if(!SHARE){return;}
  renderShareBar();
  if(Date.now()>=SHARE.endAt&&!String(SHARE.phase).endsWith('p')){const key=SHARE.phase+':'+SHARE.endAt;
    if(!SHARE_ANN[key]){SHARE_ANN[key]=1;shareNext();}}}
function shareNext(){const T={half:SHARE.half||20,rest:SHARE.rest||10};const over=Date.now()-SHARE.endAt;const fresh=over<90000;
  if(SHARE.phase==='h1'){SHARE.phase='rest';SHARE.endAt=Date.now()+T.rest*60000;
    if(fresh)timerAnnounce('বিরতির সময় হয়েছে — সবাই রেস্ট নিন!','☕',true);else toast('লাইভ খেলা: বিরতি চলছে ☕');renderShareBar();}
  else if(SHARE.phase==='rest'){SHARE.phase='h2';SHARE.endAt=Date.now()+T.half*60000;
    if(fresh)timerAnnounce('খেলা আরম্ভ করুন — মাঠে ফিরুন!','⚽',true);else toast('লাইভ খেলা: দ্বিতীয়ার্ধ চলছে ⚽');renderShareBar();}
  else if(SHARE.phase==='h2'){SHARE.phase='done';
    if(fresh)timerAnnounce('খেলা শেষ!','🏁',true);else toast('লাইভ খেলা শেষ 🏁');
    SHARE=null;renderShareBar();}}
setInterval(liveSync,10000);
setInterval(shareTick,1000);
function totals(){const inc=store.income.reduce((s,x)=>s+(+x.amount||0),0);const exp=store.expenses.reduce((s,x)=>s+(+x.amount||0),0);return{inc:inc,exp:exp,bal:inc-exp};}

/* ================= toast / modal / confirm ================= */
function toast(msg,type){const t=document.createElement('div');t.className='tmsg '+(type||'ok');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2800);}
let confirmCb=null;
function openModal(html){$('#modal-root').innerHTML='<div class="mback" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('#modal-root').innerHTML='';confirmCb=null;}
function confirmBox(msg,cb){confirmCb=cb;
  openModal('<div class="mhandle"></div><h3 class="mttl">🤔 নিশ্চিত?</h3><p class="mtxt">'+esc(msg)+'</p><div class="mbtns"><button class="btn ghost" onclick="closeModal()">না, থাক</button><button class="btn red" onclick="confirmYes()">হ্যাঁ, করুন</button></div>');}
function confirmYes(){const cb=confirmCb;closeModal();if(cb)cb();}

/* ================= image picker ================= */
function fileToDataUrl(file,max,cb){const r=new FileReader();
  r.onload=function(){const img=new Image();
    img.onload=function(){try{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.82));}catch(e){toast('ছবি পড়া গেল না','err');}};
    img.onerror=function(){toast('ছবিটি খোলা যায়নি','err');};
    img.src=r.result;};
  r.readAsDataURL(file);}
function pickPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;
  fileToDataUrl(f,340,function(d){window._photo=d;const pv=$('#phprev');
    if(pv)pv.innerHTML='<img src="'+d+'" style="width:100%;height:100%;object-fit:cover">';
    const cl=$('#phclear');if(cl)cl.style.display='inline-flex';});}
function clearPhoto(){window._photo='';const pv=$('#phprev');if(pv)pv.textContent='👤';
  const cl=$('#phclear');if(cl)cl.style.display='none';}
function pickLogo(inp){const f=inp.files&&inp.files[0];if(!f)return;
  fileToDataUrl(f,180,function(d){window._logo=d;const pv=$('#lgprev');
    if(pv)pv.innerHTML='<img src="'+d+'" style="width:100%;height:100%;object-fit:cover">';});}
function togChk(el){el.classList.toggle('on');const c=el.querySelector('input');if(c)c.checked=!c.checked;}

/* ================= router ================= */
function navActive(){if(view==='tournamentDetail')return 'tournaments';if(view==='home'||view==='members'||view==='ledger'||view==='timer'||view==='tournaments'||view==='notices')return view;return '';}

  else if(view==='tournamentDetail')h=vTournamentDetail();
  else if(view==='notices')h=vNotices();
  else if(view==='activity')h=vActivity();
  else if(view==='admin')h=vAdmin();
  else if(view==='guide')h=vGuide();

function go(v,arg){view=v;
  if(v==='tournamentDetail'){currentT=arg;}
  else{currentT=null;currentTT='match';}
  render();}
function renderHeader(){const s=store.settings;
  $('#hname').textContent=s.clubName;$('#hvil').textContent=s.village+' গ্রাম';
  $('#hlogo').innerHTML=s.logo?'<img src="'+s.logo+'">':(typeof ASSETS!=='undefined'&&ASSETS.logo?'<img src="'+ASSETS.logo+'">':'⚽');
  $('#adminbtn').textContent=isAdmin()?'⚙️':'🔐';updateBell();}
function boot(){store=load();if(!store)store=freshStore();
  if(!store.settings)store.settings=freshStore().settings;
  ['admins','players','income','expenses','tournaments','notices','log','notifications'].forEach(k=>{if(!Array.isArray(store[k]))store[k]=[];});
  if(!Array.isArray(store.coAdmins))store.coAdmins=[];
  if(store.settings.soundOn===undefined)store.settings.soundOn=true;
  if(!Array.isArray(store.settings.incCats)||!store.settings.incCats.length)store.settings.incCats=DEFAULT_INC_CATS.slice();
  if(!Array.isArray(store.settings.expCats)||!store.settings.expCats.length)store.settings.expCats=DEFAULT_EXP_CATS.slice();
  /* পুরোনো সিস্টেম (নাম+পিন) থেকে নতুন সিস্টেমে মাইগ্রেশন: প্রথম অ্যাডমিন = মূল এডমিন, বাকিরা = সহ এডমিন */
  if(store.admins.length&&!store.mainAdmin){const a=store.admins[0];
    store.mainAdmin={name:a.name,gmail:'',pwd:a.pin,legacy:true};
    store.coAdmins=store.admins.slice(1).map(x=>({id:x.id||uid(),user:x.name,pwd:x.pin,role:'সব অধিকার',at:Date.now()}));

  view='home';

  const tl=store.timerLive;

    TMR={phase:tl.phase,endAt:tl.endAt,pausedLeft:tl.pausedLeft||0,matchId:tl.matchId||'',tourId:tl.tourId||'',iv:null};

  renderHeader();render();liveSync();
  document.addEventListener('pointerdown',function(){if(typeof audioUnlock==='function')audioUnlock();},{passive:true});
  setTimeout(function(){const s=document.getElementById('splash');if(s)s.remove();},2300);
  setInterval(cdTick,1000);}

/* ================= v2: কাউন্টডাউন • ব্যানার • ফেস-অফ • কাউন্ট-আপ ================= */
function matchTs(m){if(!m||!m.date)return 0;const v=new Date(m.date+'T'+(m.time||'16:00')).getTime();return isNaN(v)?0:v;}
function nextMatch(t){const now=Date.now();const undone=t.matches.filter(m=>!m.done);
  const fut=undone.filter(m=>matchTs(m)>now).sort((a,b)=>matchTs(a)-matchTs(b));
  if(fut.length)return fut[0];
  const undated=undone.filter(m=>!matchTs(m));
  if(undated.length)return undated[0];
  const past=undone.filter(m=>matchTs(m)).sort((a,b)=>matchTs(a)-matchTs(b));
  return past.length?past[0]:null;}
function cdTick(){document.querySelectorAll('.cdwrap[data-ts]').forEach(function(w){
  const ts=+w.dataset.ts;if(!ts)return;const left=ts-Date.now();
  const sec=Math.max(0,Math.floor(left/1000));
  const map={d:Math.floor(sec/86400),h:Math.floor(sec%86400/3600),m:Math.floor(sec%3600/60),s:sec%60};
  w.querySelectorAll('[data-u]').forEach(function(b){const el=b.querySelector('b');if(el)el.textContent=bnNum(String(map[b.dataset.u]).padStart(2,'0'));});
  if(left<=0){const p=w.parentElement&&w.parentElement.querySelector('.cdtitle');if(p)p.textContent='🔴 খেলা শুরু হয়ে গেছে — মাঠে চোখ রাখুন!';}});}
function cdBoxes(ts){return `<div class="cdwrap" data-ts="${ts}">
  <div class="cdbox" data-u="d"><b>০০</b><span>দিন</span></div>
  <div class="cdbox" data-u="h"><b>০০</b><span>ঘণ্টা</span></div>
  <div class="cdbox" data-u="m"><b>০০</b><span>মিনিট</span></div>
  <div class="cdbox" data-u="s"><b>০০</b><span>সেকেন্ড</span></div></div>`;}
function teamAvs(t,teamId,cls){const tm=t.teams.find(x=>x.id===teamId);if(!tm)return '';
  const ids=tm.members||[];const ms=ids.map(id=>store.players.find(p=>p.id===id)).filter(Boolean).slice(0,5);
  if(!ms.length)return '';
  return `<div class="${cls}">${ms.map(p=>p.photo?`<span class="${cls==='fo-avs'?'fo-av':'tm-av'}"><img src="${p.photo}" alt=""></span>`:`<span class="${cls==='fo-avs'?'fo-av':'tm-av'}">${esc(initials(p.name))}</span>`).join('')}${ids.length>5?`<span class="${cls==='fo-avs'?'fo-av':'tm-av'}">+${bnNum(ids.length-5)}</span>`:''}</div>`;}
function foTeamBlock(t,teamId){const tm=t.teams.find(x=>x.id===teamId);
  const cap=tm&&tm.captain?store.players.find(p=>p.id===tm.captain):null;
  return `<div class="fo-team">
    ${tm&&tm.logo?`<img class="fo-logo" src="${tm.logo}" alt="লোগো">`:`<div class="fo-logoph">${SPORTS[t.sport]?SPORTS[t.sport].e:'🏅'}</div>`}
    <div class="fn">${esc(tm?tm.name:'—')}</div>
    <div class="fs">${(tm&&tm.members&&tm.members.length)?bnNum(tm.members.length)+' জন':''}</div>
    ${cap?`<div class="fo-cap">${cap.photo?`<span class="cav"><img src="${cap.photo}" alt=""></span>`:`<span class="cav">${esc(initials(cap.name))}</span>`}<span class="cn"><b>👑 ${esc(cap.name)}</b>ক্যাপ্টেন</span></div>`:''}
    ${teamAvs(t,teamId,'fo-avs')}</div>`;}
function faceoffCard(t,m){if(!t||!m)return '';
  const ts=matchTs(m);
  return `<div class="faceoff" onclick="go('tournamentDetail','${t.id}')" style="cursor:pointer">
    <div class="fo-grid">
      ${foTeamBlock(t,m.teamA)}
      <div class="fo-vs">VS</div>
      ${foTeamBlock(t,m.teamB)}
    </div>
    ${ts?cdBoxes(ts)+'<div class="cdtitle">খেলা শুরুর অপেক্ষায় — '+fdate(m.date)+(m.time?' • '+bnNum(m.time):'')+(m.ref?' • 🧑‍⚖️ '+esc(m.ref):'')+'</div>'
        :'<div class="fo-meta">⏰ খেলার সময় ঘোষণা হয়নি'+(m.ref?' • 🧑‍⚖️ '+esc(m.ref):'')+'</div>'}
  </div>`;}
let bTimer=null,bIdx=0,bN=0;
function bSlide(i){bIdx=i;const tr=document.getElementById('btrack');if(!tr)return;
  tr.style.transform='translateX(-'+(i*100)+'%)';
  document.querySelectorAll('.bdot').forEach((d,j)=>d.classList.toggle('on',j===i));}
function bAuto(){if(bTimer)clearInterval(bTimer);
  bTimer=setInterval(function(){if(!document.getElementById('btrack')){clearInterval(bTimer);bTimer=null;return;}
    bIdx=(bIdx+1)%bN;bSlide(bIdx);},4200);}
function bMan(i){bSlide(i);bAuto();}
function initBanner(){bN=(document.querySelectorAll('#btrack .bslide')||[]).length;
  if(bN){bSlide(0);bAuto();}else{if(bTimer){clearInterval(bTimer);bTimer=null;}}}
function countUp(){document.querySelectorAll('[data-cnt]').forEach(function(el){
  const target=+el.dataset.cnt;if(isNaN(target)){return;}
  const t0=performance.now(),dur=800;
  function step(t){const p=Math.min(1,(t-t0)/dur);
    const v=Math.round(target*(1-Math.pow(1-p,3)));
    el.textContent=el.dataset.fmt==='bdt'?bdt(v):bnNum(v);
    if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);});}
function postRender(){countUp();initBanner();if(view==='timer'&&typeof timerRender==='function')setTimeout(timerRender,0);}
</script>

function vContributors(){const m={};
  store.income.forEach(x=>{const k=x.name||'অজানা';
    if(!m[k])m[k]={tot:0,items:[]};
    m[k].tot+=(+x.amount||0);
    m[k].items.push({c:x.cat||'চাঁদা',a:+x.amount||0});});
  const rows=Object.entries(m).sort((a,b)=>b[1].tot-a[1].tot);
  if(!rows.length)return `<div class="card empty"><span class="e">🙋</span>এখনো কেউ টাকা দেননি</div>`;
  const max=rows[0][1].tot||1,total=rows.reduce((s,r)=>s+r[1].tot,0);
  const medals=['🥇','🥈','🥉'];
  return `<div class="card"><div class="tsub" style="margin-bottom:8px">🙏 মোট ${bnNum(rows.length)} জন মিলে দিয়েছেন <b style="color:#15803d">${bdt(total)}</b> — সবাইকে ধন্যবাদ! 🥇 = সর্বোচ্চ যিনি দিয়েছেন। নামের নিচে <b>কোন কাজে কত</b> দিয়েছেন সব আলাদা করে লেখা আছে।</div>

      <div class="cmed">${medals[i]||bnNum(i+1)+'.'}</div>
      ${p&&p.photo?`<span class="cav"><img src="${p.photo}" alt=""></span>`:`<span class="cav">${esc(initials(r[0]))}</span>`}
      <div class="cname"><b>${esc(r[0])}</b><div class="bar"><i style="width:${Math.max(4,v.tot/max*100)}%"></i></div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${v.items.slice(0,6).map(it=>`<span style="font-size:.62rem;background:#f0fdf4;color:#15803d;border-radius:999px;padding:2px 8px;font-weight:700">${esc(it.c)} ${bdt(it.a)}</span>`).join('')}${v.items.length>6?`<span style="font-size:.62rem;color:#64748b;padding:2px 4px">+আরও ${bnNum(v.items.length-6)}টি</span>`:''}</div></div>

    </div>`;}).join('')}</div>`;}
function vExpCats(){const m={};
  store.expenses.forEach(x=>{m[x.cat]=(m[x.cat]||0)+(+x.amount||0);});

function goalChips(t,m,limit){const evs=(m.events||[]).slice(-(limit||6));if(!evs.length)return '';

function lastGoalBanner(t,m){const evs=m.events||[];if(!evs.length||!m.done)return '';const e=evs[evs.length-1];

function goalTicker(t){const all=[];

function koRoundForNewMatch(t){const order=['প্রথম রাউন্ড','কোয়ার্টার ফাইনাল','সেমি-ফাইনাল','ফাইনাল'];

function koAdvance(t){if(t.type!=='knockout')return;
  if(t.matches.some(x=>!x.done))return;
  const order=['প্রথম রাউন্ড','কোয়ার্টার ফাইনাল','সেমি-ফাইনাল','ফাইনাল'];
  const byRound={};t.matches.forEach(x=>{(byRound[x.round]=byRound[x.round]||[]).push(x);});
  let li=-1;order.forEach((r,i)=>{if(byRound[r]&&byRound[r].length)li=i;});
  if(li<0)return;
  const winners=byRound[order[li]].map(x=>x.winner).filter(Boolean);
  const played=new Set();byRound[order[li]].forEach(x=>{played.add(x.teamA);played.add(x.teamB);});
  const byes=t.teams.map(tm=>tm.id).filter(id=>!played.has(id));
  const adv=winners.concat(byes);
  if(!adv.length)return;
  if(order[li]==='ফাইনাল'||adv.length===1||!order[li+1]){
    t.champion=adv[0];t.status='সম্পন্ন';
    logAct('চ্যাম্পিয়ন ঘোষণা (অটো) ['+t.name+']: '+tName(t,adv[0]));
    notify('🏆 চ্যাম্পিয়ন ঘোষণা!',tName(t,adv[0])+' টুর্নামেন্ট "'+t.name+'" জিতে নিয়েছে — অভিনন্দন! 🎉','champion');
    return;}
  const nextR=order[li+1];
  for(let i=0;i+1<adv.length;i+=2){
    t.matches.push({id:uid(),round:nextR,teamA:adv[i],teamB:adv[i+1],date:'',time:'',ref:'',done:false,scoreA:0,scoreB:0,winner:''});}
  logAct('পরের পর্ব তৈরি (অটো) ['+t.name+']: '+nextR);
  notify('⚔️ পরের পর্ব তৈরি হয়েছে','"'+t.name+'" — '+nextR+': কে জিতবে? সবাই মাঠে চোখ রাখুন!','match');}

function timerAnnounce(msg,emoji,which){const ov=document.createElement('div');ov.className='tann';
  const seq=(typeof ANN_AUD!=='undefined'&&ANN_AUD&&ANN_AUD[which])?ANN_AUD[which]:null;
  ov.innerHTML=`<div class="te">${emoji}</div><div class="tt">${msg}</div><div id="annround" style="color:#bbf7d0;font-size:.8rem;font-weight:700">— ${bnDigits(1)} বার ঘোষণা${seq?' • 🔊 ছেলে কণ্ঠ':''} —</div>`;
  document.body.appendChild(ov);
  const finish=function(){setTimeout(function(){if(ov.parentNode)ov.parentNode.removeChild(ov);},600);};
  if(!seq){timerBeep();timerSay(msg);let n=1;
    const iv=setInterval(function(){n++;timerBeep();timerSay(msg);
      const rd=ov.querySelector('#annround');if(rd)rd.textContent='— '+bnDigits(n)+' বার ঘোষণা —';
      if(n>=3){clearInterval(iv);finish();}},1700);return;}
  let i=0,clipDone=false;
  const play=function(){if(i>=seq.length||!seq[i]){finish();return;}
    const rd=ov.querySelector('#annround');
    if(rd)rd.textContent='— '+bnDigits(i+1)+' বার ঘোষণা • 🔊 '+(i===1?'মেয়ে':'ছেলে')+' কণ্ঠ —';

    let au=null;try{au=new Audio(seq[i]);au.volume=1;}catch(e){au=null;}

    setTimeout(function(){if(!clipDone){try{timerSay(msg);}catch(e){}next();}},

  play();}

function timerPlayMinute(){const T=timerCfg();const halfMs=T.half*60000;
  if(TMR.phase==='h1'||TMR.phase==='h1p')return Math.max(1,Math.ceil((halfMs-timerLeftMs())/60000));
  if(TMR.phase==='rest'||TMR.phase==='restp')return T.half;
  if(TMR.phase==='h2'||TMR.phase==='h2p')return T.half+Math.max(1,Math.ceil((halfMs-timerLeftMs())/60000));
  if(TMR.phase==='done')return T.half*2;

function timerGo(){const T=timerCfg();

  else if(TMR.phase==='h1p'||TMR.phase==='restp'||TMR.phase==='h2p'){TMR.phase=TMR.phase.slice(0,-1);TMR.endAt=Date.now()+(TMR.pausedLeft||60000);}

function timerNext(){const T=timerCfg();const over=Date.now()-TMR.endAt;const fresh=over<90000;
  if(TMR.phase==='h1'){TMR.phase='rest';TMR.endAt=Date.now()+T.rest*60000;

function teamSave(tId,tmId){const t=store.tournaments.find(x=>x.id===tId);if(!t)return;

  const n=$('#tm-name').value.trim()||(tm0?tm0.name:'দল '+bnNum(t.teams.length+1));

  let cap=$('#tm-cap').value||'';
  if(cap&&!members.includes(cap))cap='';

  if(tmId){Object.assign(t.teams.find(x=>x.id===tmId),data);logAct('দল সম্পাদনা ['+t.name+']: '+n+' ('+members.length+' জন'+(cap?', ক্যাপ্টেন':'')+')');}

function championForm(tId){const t=store.tournaments.find(x=>x.id===tId);if(!t)return;

    <div class="fgrp"><label>প্রকৃতি</label><select id="nt-pri">${['সাধারণ','গুরুত্বপূর্ণ','জরুরি'].map(p=>`<option ${n&&n.pri===p?'selected':''}>${p}</option>`).join('')}</select></div>

function noticeSave(id){const title=$('#nt-title').value.trim(),body=$('#nt-body').value.trim();
  if(!title||!body){toast('শিরোনাম ও বিস্তারিত দুটোই লিখুন','err');return;}
  const data={title:title,body:body,pri:$('#nt-pri').value,date:$('#nt-date').value||todayISO(),by:curAdmin().name,createdAt:new Date().toISOString()};
  if(id)Object.assign(store.notices.find(x=>x.id===id),data);
  else store.notices.push(Object.assign({id:uid()},data));
  logAct((id?'নোটিশ সম্পাদনা: ':'নতুন নোটিশ: ')+title);
  if(!id)notify('📢 নতুন নোটিশ এসেছে',title+(data.pri==='জরুরি'?' (জরুরি!)':''),'notice');
  save();closeModal();render();toast('নোটিশ প্রকাশিত ✅');}
function noticeDel(id){const n=store.notices.find(x=>x.id===id);if(!n)return;
  confirmBox('"'+n.title+'" নোটিশটি মুছবেন?',function(){
    store.notices=store.notices.filter(x=>x.id!==id);
    logAct('নোটিশ মুছে ফেলা: '+n.title);save();closeModal();render();toast('মুছে ফেলা হয়েছে');});}

<script>

function loginTab(t){document.getElementById('lt-main').classList.toggle('on',t==='main');
  document.getElementById('lt-co').classList.toggle('on',t!=='main');

function loginDone(s){setSession(s);closeModal();renderHeader();go('admin');toast('স্বাগতম, '+s.name+' 👋');}
function mainTry(){const M=store.mainAdmin;
  const mail=$('#lg-mail').value.trim().toLowerCase();
  const pwd=$('#lg-pass2').value||'';
  const oldpin=$('#lg-oldpin')?$('#lg-oldpin').value:'';
  if(M&&M.legacy&&oldpin&&hashPin(oldpin)===M.pwd){loginDone({kind:'main',name:M.name,gmail:M.gmail||'',role:'মূল এডমিন'});return;}
  const mailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail);
  if(!M){
    const nm=$('#lg-name')?$('#lg-name').value.trim():'';
    if(!nm){toast('আপনার নাম লিখুন','err');return;}
    if(!mailOk){toast('সঠিক জিমেইল ঠিকানা লিখুন','err');return;}
    if(pwd.length<4){toast('পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের দিন','err');return;}
    store.mainAdmin={name:nm,gmail:mail,pwd:hashPin(pwd),legacy:false};
    logAct('মূল এডমিন নিবন্ধন: '+nm+' ('+mail+')');save();
    loginDone({kind:'main',name:nm,gmail:mail,role:'মূল এডমিন'});return;}
  if(M.gmail&&mail===M.gmail&&M.pwd===hashPin(pwd)){loginDone({kind:'main',name:M.name,gmail:mail,role:'মূল এডমিন'});return;}
  toast(M.legacy?'জিমেইল এখনো যোগ হয়নি — আগের পিন দিয়ে ঢুকুন':'জিমেইল বা পাসওয়ার্ড ভুল!','err');}
async function coTry(){const u=$('#lg-user').value.trim(),p=$('#lg-pass').value||'';

  toast('অনলাইনে যাচাই হচ্ছে…');

    if(r&&r.idToken){loginDone({kind:'co',name:u,role:'সব অধিকার'});return;}

function backupExport(){const blob=new Blob([JSON.stringify(store,null,1)],{type:'application/json'});

  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
    document.body.appendChild(a);a.click();a.remove();

function vGuide(){const sec=[
  ['🏠 অ্যাপটি কী কী করে?','হোম পেজে নিজে থেকে ঘোরা <b>ব্যানার</b> — সর্বোচ্চ ৩টি স্লাইড ঘুরে ঘুরে আসে: ১) চলমান টুর্নামেন্ট ও পরের ম্যাচ ২) ক্লাবের হিসাব ৩) সর্বশেষ নোটিশ। নিচের ছোট ডট বোতামে চেপে ইচ্ছে করে স্লাইড বদলানো যায়। এছাড়া <b>পরের ম্যাচের কাউন্টডাউন</b> (দুই দলের লোগো-ক্যাপ্টেন-খেলোয়াড়সহ ফেস-অফ কার্ড), অ্যানিমেটেড হিসাবের সারসংক্ষেপ আর সর্বশেষ নোটিশ। নিচের ৫টি বোতামে সব পাতা: হোম, সদস্য, হিসাব, টুর্নামেন্ট, নোটিশ — সবাই সব দেখতে পারবে, এটাই স্বচ্ছতা।'],
  ['🔐 অ্যাডমিন সিস্টেম — মূল এডমিন ও সহ এডমিন','সাধারণ সদস্যরা অ্যাপ খুললেই সরাসরি হোম পেজ দেখবেন — তাঁদের কোনো লগইন লাগে না। অ্যাডমিন কাজ করতে হেডারের ডান কোণের <b>🔒</b> বোতামে চাপুন → দুটি ট্যাব আসবে: <b>👑 মূল এডমিন</b> — ক্লাবের প্রধান ব্যক্তি তাঁর <b>জিমেইল + পাসওয়ার্ড</b> দিয়ে ঢুকবেন (এই ফোনে প্রথমবার ঢোকার সময় নিবন্ধন হয়ে যাবে)। আগের সংস্করণে পিন দিয়ে চালাতেন? সেই পিনেই এখনো ঢুকতে পারবেন, পরে প্যানেল থেকে জিমেইল যোগ করে আপগ্রেড করুন। <b>🤝 সহ এডমিন</b> — মূল এডমিন যে ইউজারনেম ও পাসওয়ার্ড দিয়েছেন, সেটা দিয়ে ঢুকবেন। লগইন করলেই প্রতিটি পাতায় অনুমতি অনুযায়ী যোগ/সম্পাদনা/মুছে ফেলার বোতাম দেখা যাবে। প্রতি এন্ট্রিতে কে লিখল, সেটাও জমা থাকে।'],
  ['📡 সবার ফোনে একসাথে লাইভ ঘড়ি (মূল এডমিন চালু করবে)','একবার সেটআপ (১ মিনিট): console.firebase.google.com → আপনার প্রজেক্ট (shovarampur-sports) → বাম মেনু থেকে <b>Realtime Database → Create database</b> → লোকেশন যেটা দেখায় সেটাই রাখুন → <b>Start in \"test mode\"</b> বেছে <b>Enable</b> চাপুন। তারপর: টাইমার চালু করে অ্যাডমিন বোতামের মধ্যে <b>📡 সবার ফোনে শেয়ার করুন</b> চাপলেই — গ্রামের যে ফোনেই অ্যাপ খোলা, সবার স্ক্রিনে লাল ব্যানার: <b>"📡 লাইভ খেলা চলছে — প্রথমার্ধ ১২:৩৪"</b>; ব্যানারে চাপ দিলে পুরো ঘড়ি খুলবে। ঘড়ি সবার ফোনে একই সময় দেখাবে, অর্ধ-বিরতি-শেষের তিনবার-ঘোষণাও প্রত্যেক ফোনেই বাজবে (অ্যাপ খোলা থাকলে)। খেলা শেষে <b>⏹ শেয়ার বন্ধ করুন</b> দিলে ব্যানার সবার থেকে চলে যাবে। খেয়াল রাখুন: শেয়ার করা ঘড়ি দেখতে ও ঘোষণা পেতে ইন্টারনেট লাগে; গোল-নামের লিস্ট এখনো প্রতি ফোনে আলাদা থাকে। শেয়ার না করলেও আগের মতো লোকাল টাইমার সবাই ব্যবহার করতে পারবেন।'],
  ['🤝 সহ এডমিন বানানো ও পদবি দেওয়া','মূল এডমিন লগইন করে অ্যাডমিন প্যানেলের <b>"🤝 সহ এডমিন ম্যানেজার"</b> অংশে যান → <b>+ সহ এডমিন যোগ</b> → ইউজারনেম (যেমন: ইয়াসিন), <b>পদবি</b> ও পাসওয়ার্ড দিন। পদবির নিয়ম: <b>সব অধিকার</b> = সব কাজ; <b>হিসাব</b> = শুধু আয়-ব্যয় লেখা; <b>টুর্নামেন্ট</b> = শুধু টুর্নামেন্ট ও ম্যাচ; <b>সদস্য</b> = শুধু সদস্য তালিকা; <b>নোটিশ</b> = শুধু নোটিশ দেওয়া। তৈরি হলে ইউজারনেম-পাসওয়ার্ড ওই ব্যক্তিকে জানিয়ে দিন — তিনি তাঁর ফোনে অ্যাপ খুলে 🔒 চেপে "সহ এডমিন" ট্যাব থেকে ঢুকবেন। <b>যেকোনো ফোন থেকে লগইন চালু করতে</b> (একবারই করতে হবে): console.firebase.google.com → আপনার প্রজেক্ট (shovarampur-sports) → <b>Authentication → Get started → Sign-in method → Email/Password → Enable → Save</b>। চালু না থাকলেও মূল এডমিনের ফোনে বানানো অ্যাকাউন্ট দিয়ে ওই ফোনেই ঢোকা যায়। পাসওয়ার্ড বদল বা বাদ দেওয়াও এই ম্যানেজারেই।'],
  ['💰 হিসাব রাখার নিয়ম','১) কেউ টাকা দিলে <b>হিসাব → + আয় যোগ</b> থেকে নাম, টাকা, খাত লিখুন। যেমন: সাকিব মাঠ ভাড়ার জন্য ১৫০ দিলে — নাম "সাকিব", খাত "মাঠ ভাড়া", টাকা ১৫০; পরে সাকিব লাইটের জন্য আবার দিলে আবার এক লাইন — <b>সাকিবের মোট নিজে থেকেই জমা হবে</b>। ২) বিদ্যুৎ বিল, নেট, বল ইত্যাদি কিনলে <b>+ ব্যয় যোগ</b> থেকে লিখুন। ৩) "🙋 কে কত দিয়েছে" ট্যাবে প্রতিজনের মোট, সর্বোচ্চ দাতা 🥇, আর নামের নিচে <b>কোন কাজে কত</b> দিয়েছেন সব আলাদা করে দেখা যায় — সবাই দেখতে পারে। উপরে সদস্য পাতায় "মোট তহবিল" কার্ডে মাঠে এখন কত টাকা আছে দেখা যায় (আয় − ব্যয়)।'],
  ['📷 ছবি আপলোড','সদস্য → + নতুন → গোল ছবিতে চাপ দিয়ে ফোনের গ্যালারি থেকে ছবি বাছুন। ছবি ফোনেই ছোট করে জমা হয়, তাই জায়গা কম লাগে। ফুটবল-ক্রিকেট-ব্যাডমিন্টন বাছাই দিলে খেলা অনুযায়ী সদস্য ছেঁকে দেখা যাবে। সদস্যের <b>মোবাইল নম্বর ইংরেজিতে</b> লিখুন — প্রোফাইলে 📋 চেপে নম্বরটি সরাসরি কপি করা যায়।'],
  ['🔔 নোটিফিকেশন — কীভাবে কাজ করে?','হেডারের 🔔 বোতামে চাপ দিলে সব নোটিফিকেশন দেখা যায়। এডমিন <b>নোটিশ দিলে, নতুন ম্যাচ বা ফলাফল লিখলে, চ্যাম্পিয়ন ঘোষণা করলে</b> প্রতিটি ফোনের 🔔-এ লাল ব্যাজ ওঠে আর ছোট ঘণ্টার শব্দ বাজে — মেসেঞ্জারের মতোই। শব্দ বন্ধ/চালু করার বোতাম অ্যাডমিন প্যানেলে। মনে রাখবেন: ইন্টারনেট-ছাড়া অ্যাপে সবার ফোনে একসাথে নোটিফিকেশন "ভেসে ওঠা" (পুশ) পাঠাতে আলাদা সার্ভার লাগে; এই অ্যাপে সদস্যরা অ্যাপ খুললেই নতুন সব নোটিফিকেশন অটো পেয়ে যান।'],
  ['⚙️ হিসাবের খাত নিজেদের মতো সাজান + মাঠ ভাড়া','আমাদের মাঠের <b>বছরে ২,০০০ টাকা মাঠ ভাড়া</b> — এটা "মাঠ ভাড়া" খাতে লিখুন (ব্যয় যোগ → খাত: মাঠ ভাড়া)। বিদ্যুৎ বিল, নেট-বল, রেফারি ফি, পানি-ফলমূল সব খাত আগে থেকেই আছে; নতুন খাত দরকার হলে অ্যাডমিন প্যানেল → "নোটিফিকেশন ও হিসাবের খাত" → + নতুন খাত। আর লাগে না এমন খাত ✕ চেপে বাদ দিন — ফর্মে শুধু নিজেদের খাতগুলোই দেখাবে।'],
  ['🏆 টুর্নামেন্ট চালানোর পুরো নিয়ম (একবার পড়লেই হবে)','<b>ধাপ ১ — টুর্নামেন্ট খুলুন:</b> টুর্নামেন্ট পাতা → "+ নতুন" → খেলা বাছুন (⚽/🏏/🏸), তারপর ধরন বাছুন — <b>নকআউট</b> মানে "হারলেই বাদ" (যেমন ৪ দল: ২টি সেমি-ফাইনাল → ফাইনাল → চ্যাম্পিয়ন), <b>লিগ</b> মানে "সবাই সবার সাথে খেলবে, পয়েন্টে যে সেরা সে-ই চ্যাম্পিয়ন"। <b>ধাপ ২ — দল যোগ:</b> "+ দল যোগ" → প্রতি দলের একটা ছবি/লোগো দিন — নাম না দিলে "দল ১, দল ২…" নিজে থেকে হবে। খেলোয়াড় বাছাই ও ক্যাপ্টেন ঐচ্ছিক। <b>ধাপ ৩ — ম্যাচ:</b> "⚡ অটো ম্যাচ" চাপলে দুটো বাছাই আসবে — <b>🎲 র‍্যান্ডম ড্র</b> (লটারির মতো দল মিশিয়ে নির্পক্ষভাবে জোড়া তোলা) অথবা <b>🔢 তালিকা অনুযায়ী</b> (যে ক্রমে দল যোগ করেছেন)। নিজে হাতে বসাতে চাইলে "+ ম্যাচ" বোতাম দিয়ে কোন দল কার সাথে খেলবে তা বেছে নিন। কোনো ম্যাচে তারিখ-সময় দিতে চাইলে ম্যাচের পাশে ✏️ — তখন হোম পেজে কাউন্টডাউন ও ফেস-অফ কার্ড দেখা যাবে। <b>ধাপ ৪ — ফলাফল (সবচেয়ে সহজ):</b> খেলা শেষে ম্যাচের পাশের <b>🎯 ফলাফল</b> বোতামে চাপুন → কোন দল জিতলো, সেই দলের কার্ডে চাপ দিন (স্কোর জানলে লিখুন — ফুটবলে গোল, ক্রিকেটে রান, ব্যাডমিন্টনে সেট; না জানলে খালি — ১-০ ধরা হবে) → "জমা দিন"। ব্যস! <b>লিগে</b> জয়ে ৩ পয়েন্ট, ড্রয়ে ১ — "📊 পয়েন্ট তালিকা" ট্যাব নিজেই হিসাব করে সাজিয়ে দেয়। <b>নকআউটে</b> জয়ী দল নিজে থেকে পরের পর্বে (সেমি-ফাইনাল → ফাইনাল) উঠে যায়, হারা দল বাদ — ফাইনাল শেষ হলেই <b>চ্যাম্পিয়ন ঘোষণা অটোমেটিক</b>, সবার ফোনে নোটিফিকেশন ও ট্রফি যায়। আপনাকে আর কিছুই হিসাব করতে হবে না — শুধু বিজয়ীতে চাপ দিন।'],
  ['⏱️ ম্যাচ টাইমার — সবাই চালাতে পারবেন','টুর্নামেন্ট খুলুন → নিচের বড় <b>⏱️ লাইভ ম্যাচ টাইমার</b> বোতামে চাপুন — এটা সাধারণ সদস্য থেকে অ্যাডমিন, <b>সবাই</b> ব্যবহার করতে পারবেন। ১) <b>সময় ঠিক করুন:</b> "প্রতি অর্ধ কত মিনিট?" আর "বিরতি কত মিনিট?" — ১০/১৫/২০/২৫/৩০ চিপে চাপ দিন বা নিজের সংখ্যা লিখুন। ২) <b>▶ শুরু করুন</b> — বড় ঘড়ি চলবে। ৩) প্রথমার্ধ শেষ হলেই শব্দ+পুরো স্ক্রিনে তিনবার: <b>"বিরতির সময় হয়েছে — সবাই রেস্ট নিন!"</b> → ৪) বিরতি শেষে তিনবার: <b>"খেলা আরম্ভ করুন!"</b> → ৫) দ্বিতীয়ার্ধ শেষে তিনবার: <b>"খেলা শেষ!"</b> — তখন অ্যাডমিন 🎯 ফলাফল লিখবেন। <b>⚽ গোল লেখা:</b> টাইমারে ম্যাচ বাছাই করে রাখলে <b>⚽ গোল!</b> বোতাম পাবেন — কে গোল দিলো নাম লিখুন, <b>কত মিনিটে</b> তা ঘড়ি থেকে নিজে থেকে যোগ হবে (যেমন: "সুজন — ৫ মিনিটে গোল")। গোলগুলো ম্যাচের নিচে লাল চিপে দেখা যাবে। অ্যাডমিন চাইলে ➕ ইভেন্ট দিয়ে ম্যানুয়ালিও যোগ করতে পারবেন। <b>স্ক্রিন অফ বা অ্যাপ বন্ধ হলেও ঘড়ি চলতে থাকে</b> — ফিরে এসে খুললেই ঠিক সময় দেখবেন; বিরতি/শেষের ঘোষণা মিস হলে ঢুকেই জানা যাবে। মাঝে থামাতে ⏸, চালুতে ▶, রিসেটে ⏹। ফুটবল-ক্রিকেট-ব্যাডমিন্টন সব খেলায় চলে।'],
  ['💾 ব্যাকআপ — খুব জরুরি!','এই অ্যাপের ডেটা ফোনেই (ইন্টারনেট ছাড়া) জমা হয়। তাই: <b>১)</b> যে ফোনে হিসাব লেখা হয় সেটিকে মূল ফোন ধরুন। <b>২)</b> অ্যাডমিন প্যানেল → ব্যাকআপ / শেয়ার → ফাইলটি WhatsApp বা অন্য ফোনে পাঠিয়ে রাখুন (মাসে অন্তত একবার)। <b>৩)</b> অন্য অ্যাডমিনের ফোনে হিসাব দেখাতে চাইলে সেখানে ব্যাকআপ ইমপোর্ট করুন। ফোন হারালে/নষ্ট হলে ব্যাকআপ থেকে সব ফেরানো যাবে।'],
  ['📲 ফোনে অ্যাপের মতো চালানো','ব্রাউজারে (Chrome) অ্যাপের ঠিকানা খুলুন → মেনু (⋮) → <b>"Add to Home screen" / "হোম স্ক্রিনে যোগ করুন"</b>। তখন অ্যাপের আইকনে চেপে যেমন অন্য অ্যাপ খোলা যায়, তেমনই খুলবে। ইন্টারনেট ছাড়াও চলবে।'],
  ['🛡️ নিরাপত্তা ও ভালো চলার নিয়ম','১) পিন সহজ (1234) রাখবেন না, আর কাউকে লিখে পাঠাবেন না। ২) ভুল এন্ট্রি হলে ✏️ দিয়ে ঠিক করুন — মুছে ফেলার বদলে সম্পাদনা ভালো, ইতিহাস পরিষ্কার থাকে। ৩) মাস শেষে হিসাব মিলিয়ে নোটিশে টাকাপত্র প্রকাশ করুন। ৪) প্রয়োজনে অ্যাডমিন বদলালে পিন পাল্টে নিন।']]; 
  return `<div class="shead"><h3>📖 সহায়িকা (গাইড)</h3></div>
  <div class="card" style="background:#f0fdf4;border-color:#bbf7d0"><div class="mtxt">শোভারামপুর স্পোর্টস ফ্যামিলির অ্যাপে স্বাগতম! নিচের যেকোনো প্রশ্নে চাপ দিলে উত্তর খুলে যাবে।</div></div>
  ${sec.map(s=>`<div class="acc"><button onclick="togAcc(this)"><span>${s[0]}</span><span>▾</span></button><div>${s[1]}</div></div>`).join('')}
  <div class="card" style="background:#eff6ff;border-color:#bfdbfe"><div class="mtxt">💚 এই অ্যাপটি আমাদের গ্রামের নিজস্ব। নতুন কেউ যুক্ত হলে তাকে এই সহায়িকাটি দেখান — এতেই ঝগড়া থামবে, হিসাব স্বচ্ছ থাকবে।</div></div>`;}

boot();
</script>
