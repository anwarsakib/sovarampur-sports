name: অ্যাপ বিল্ড ও রিলিজ (APK)

# main ব্রাঞ্চে পুশ করলেই অটো বিল্ড + রিলিজ হবে।
# অথবা Actions ট্যাব → "অ্যাপ বিল্ড ও রিলিজ (APK)" → "Run workflow"।
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "ভার্সন নাম (যেমন: 3.4)"
        required: false
        default: "3.9"

permissions:
  contents: write

jobs:
  build-apk:
    name: APK তৈরি ও GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: অ্যাপের ফাইল প্রস্তুত করুন
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          echo "index.html কপি হয়েছে ($(du -h android/app/src/main/assets/index.html | cut -f1))"

      - name: ফায়ারবেস যাচাই (ঐচ্ছিক)
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "✅ google-services.json পাওয়া গেছে — পুশ নোটিফিকেশন সহ বিল্ড হবে"
          else
            echo "ℹ️ google-services.json নেই — ফায়ারবেস ছাড়া বিল্ড হবে (অ্যাপের ভেতরের সব ফিচার ঠিকই চলবে)"
          fi

      - name: APK বিল্ড (Release, সাইনড)
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PappVersionName="${{ github.event.inputs.version_name || '3.9' }}"

      - name: APK ফাইল নামকরণ
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '3.9' }}.apk"
          ls -la out/

      - name: GitHub Release তৈরি — লিংক দিলেই সবাই ডাউনলোড করতে পারবে
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version_name || '3.9' }}"
          name: "⚽ Shobarampur Sports Family — v${{ github.event.inputs.version_name || '3.9' }}"
          make_latest: true
          overwrite_files: true
          files: out/*.apk
          body: |
            ## 📱 ডাউনলোড করার নিয়ম
            ১. নিচের **Assets** অংশ থেকে `Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '3.9' }}.apk` ফাইলটি চাপুন — ডাউনলোড শুরু হবে (কোনো লগইন লাগে না)।
            ২. ফোনে খুলে **ইনস্টল** চাপুন। "অজানা উৎস থেকে ইনস্টল করার অনুমতি" চাইলে অনুমতি দিন।
            ৩. আগের ভার্সন থাকলে উপরে নতুনটা ইনস্টল হয়ে যাবে — ডেটা মুছবে না।

            ## ✨ v3.9-এ নতুন
            - 🔐 **পিন সিস্টেম আরও নিরাপদ:** রিকভারি পিন এখন **নিরাপদ সার্ভারে (Firebase) হ্যাশ হয়ে** যাচাই হয় — অ্যাপের কোডে বা স্ক্রিনে কোথাও পিন লেখা থাকে না; রিকভারিতে ঢুকেই নতুন পিন সেট করতে বলা হয়; পিন ৪–৬ ডিজিটের করা যায়; তালার আইকন চেপে ধরলেও পিন-স্ক্রিন খোলে
            - 🎨 **নতুন ডিজাইন:** ইমোজির বদলে **ঝকঝকে ভেক্টর (SVG) আইকন** — নেভিগেশন, হেডার, প্যানেল সব জায়গায়; নেভিগেশনে সবুজ পিল, লাইভ-ব্যানারে চলমান লাল গ্রেডিয়েন্ট ও পালস-ডট
            - 🔴 **লাইভ খেলা সবার জন্য সম্পূর্ণ:** সাধারণ সদস্যরা দেখবে **কোন দল কার বিপক্ষে, বর্তমান স্কোর, ঘড়ি, গোলের সম্পূর্ণ ইতিহাস** — কিন্তু কোনো নিয়ন্ত্রণ বোতাম নেই (নিয়ন্ত্রণ শুধু পিন দিলে); কর্তৃপক্ষ খেলা বন্ধ করলে সবার ফোনে সঙ্গে সঙ্গে বন্ধ
            - ⚽ **এক-ট্যাপে গোল:** ঘড়ির নিচেই খেলোয়াড়দের নাম (লাল=এক দল, নীল=অন্য দল) — নামে চাপ দিলেই গোল, মিনিট অটো; একই গোল দুবার ঢোকে না; কর্তৃপক্ষ চাইলে **সদস্যদেরও গোল দেওয়ার অনুমতি** দিতে/বন্ধ করতে পারেন
            - 🔔 **নোটিফিকেশন আরও নির্ভরযোগ্য:** একাধিক অপেক্ষমাণ খবর থাকলে সবগুলো ক্রমানুসারে যায় (নেট ফিরলে হারানো খবরও); গোল, লাইভ শুরু/বন্ধ, ফলাফল, চ্যাম্পিয়ন — সবই এখন পুশ
            - 💰 **হিসাবে সদস্য-ফিল্টার:** নাম লিখে বা চিপে চাপ দিয়ে যেকোনো সদস্যের জমা-খরচ-ব্যালেন্স আলাদা দেখুন; সদস্যের প্রোফাইল থেকেই এক চাপে "+ জমা যোগ"
            - 📤 **অ্যাপ-শেয়ার বাটন:** সহায়িকা ও প্যানেল থেকে অ্যাপের লিংকসহ শেয়ার (লিংক প্যানেলে বসানো যায়)
            - ⚡ **সিঙ্ক আরও দ্রুত:** ১২ সেকেন্ডে আপডেট চেক, লেখা হলে ১ সেকেন্ডেই ক্লাউডে; অ্যাপ সামনে এলে/নেট ফিরলে সাথে সাথে
            - 🧹 সাধারণ সদস্যের স্ক্রিন থেকে প্রবেশের সব নির্দেশনা সরানো; সব পেজে পরীক্ষা সম্পন্ন — ভুল: ০
- 🧹 লাইভ-ব্যানার এখন অটো-নিভে যায় (অন্য ফোনে পুরোনো ব্যানার আর ঝুলে থাকে না)

            ## ⚙️ এডমিনদের জন্য (একবারই)
            - **সহ এডমিন যেকোনো ফোন থেকে লগইন** করাতে: Firebase Console → **Authentication → Sign-in method → Email/Password → Enable**
            - **সবার ফোনে লাইভ ঘড়ি** চালু করতে: Firebase Console → **Realtime Database → Create database → Start in test mode**

      - name: APK আর্টিফ্যাক্ট (ব্যাকআপ কপি)
        uses: actions/upload-artifact@v4
        with:
          name: Shobarampur-Sports-Family-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
