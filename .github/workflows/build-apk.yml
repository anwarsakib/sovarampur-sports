name: অ্যাপ বিল্ড ও রিলিজ (APK)

# main ব্রাঞ্চে পুশ করলেই অটো বিল্ড + রিলিজ হবে।
# অথবা Actions ট্যাব → "অ্যাপ বিল্ড ও রিলিজ (APK)" → "Run workflow"।
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "ভার্সন নাম (যেমন: 3.4)"
        required: false
        default: "3.4"

permissions:
  contents: write

jobs:
  build-apk:
    name: APK তৈরি ও GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: অ্যাপের ফাইল প্রস্তুত করুন
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          echo "index.html কপি হয়েছে ($(du -h android/app/src/main/assets/index.html | cut -f1))"

      - name: ফায়ারবেস যাচাই (ঐচ্ছিক)
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "✅ google-services.json পাওয়া গেছে — পুশ নোটিফিকেশন সহ বিল্ড হবে"
          else
            echo "ℹ️ google-services.json নেই — ফায়ারবেস ছাড়া বিল্ড হবে (অ্যাপের ভেতরের সব ফিচার ঠিকই চলবে)"
          fi

      - name: APK বিল্ড (Release, সাইনড)
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PappVersionName="${{ github.event.inputs.version_name || '3.4' }}"

      - name: APK ফাইল নামকরণ
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '3.4' }}.apk"
          ls -la out/

      - name: GitHub Release তৈরি — লিংক দিলেই সবাই ডাউনলোড করতে পারবে
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version_name || '3.4' }}"
          name: "⚽ Shobarampur Sports Family — v${{ github.event.inputs.version_name || '3.4' }}"
          make_latest: true
          overwrite_files: true
          files: out/*.apk
          body: |
            ## 📱 ডাউনলোড করার নিয়ম
            ১. নিচের **Assets** অংশ থেকে `Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '3.4' }}.apk` ফাইলটি চাপুন — ডাউনলোড শুরু হবে (কোনো লগইন লাগে না)।
            ২. ফোনে খুলে **ইনস্টল** চাপুন। "অজানা উৎস থেকে ইনস্টল করার অনুমতি" চাইলে অনুমতি দিন।
            ৩. আগের ভার্সন থাকলে উপরে নতুনটা ইনস্টল হয়ে যাবে — ডেটা মুছবে না।

            ## ✨ v3.4-এ নতুন
            - 👑 **মূল এডমিন জিমেইল দিয়ে লগইন** + 🤝 **সহ এডমিন সিস্টেম** (ইউজারনেম-পাসওয়ার্ড, পদবি অনুযায়ী অধিকার)
            - 🔒 সাধারণ ইউজার সরাসরি হোম পেজ — লগইন স্ক্রিন নেই
            - ⏱️ **ম্যাচ টাইমার সবার জন্য** + ⚽ **গোল লগ** (কে, কত মিনিটে গোল)
            - 🕒 **স্ক্রিন অফ / অ্যাপ বন্ধ থাকলেও টাইমার চলে**
            - 📡 **সবার ফোনে একসাথে লাইভ ঘড়ি** (Firebase Realtime Database চালু করলে)

            ## ⚙️ এডমিনদের জন্য (একবারই)
            - **সহ এডমিন যেকোনো ফোন থেকে লগইন** করাতে: Firebase Console → **Authentication → Sign-in method → Email/Password → Enable**
            - **সবার ফোনে লাইভ ঘড়ি** চালু করতে: Firebase Console → **Realtime Database → Create database → Start in test mode**

      - name: APK আর্টিফ্যাক্ট (ব্যাকআপ কপি)
        uses: actions/upload-artifact@v4
        with:
          name: Shobarampur-Sports-Family-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
