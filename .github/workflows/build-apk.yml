name: অ্যাপ বিল্ড ও রিলিজ (APK)

# main ব্রাঞ্চে পুশ করলেই অটো বিল্ড + রিলিজ হবে।
# অথবা Actions ট্যাব → "অ্যাপ বিল্ড ও রিলিজ (APK)" → "Run workflow"।
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "ভার্সন নাম (যেমন: 4.0)"
        required: false
        default: "4.0"

permissions:
  contents: write

jobs:
  build-apk:
    name: APK তৈরি ও GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: অ্যাপের ফাইল প্রস্তুত করুন
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          echo "index.html কপি হয়েছে ($(du -h android/app/src/main/assets/index.html | cut -f1))"

      - name: ফায়ারবেস যাচাই (ঐচ্ছিক)
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "✅ google-services.json পাওয়া গেছে — পুশ নোটিফিকেশন সহ বিল্ড হবে"
          else
            echo "ℹ️ google-services.json নেই — ফায়ারবেস ছাড়া বিল্ড হবে (অ্যাপের ভেতরের সব ফিচার ঠিকই চলবে)"
          fi

      - name: APK বিল্ড (Release, সাইনড)
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PappVersionName="${{ github.event.inputs.version_name || '4.0' }}"

      - name: APK ফাইল নামকরণ
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '4.0' }}.apk"
          ls -la out/

      # রিলিজের বিবরণ (নিচের body অংশে প্রতিটি লাইনের আগে ১২টি স্পেস থাকতে হবে)
      - name: GitHub Release তৈরি — লিংক দিলেই সবাই ডাউনলোড করতে পারবে
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version_name || '4.0' }}"
          name: "⚽ Shobarampur Sports Family — v${{ github.event.inputs.version_name || '4.0' }}"
          make_latest: true
          overwrite_files: true
          files: out/*.apk
          body: |
            ## 📱 ডাউনলোড করার নিয়ম
            ১. নিচের **Assets** অংশ থেকে `Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '4.0' }}.apk` ফাইলটি চাপুন — ডাউনলোড শুরু হবে (কোনো লগইন লাগে না)।
            ২. ফোনে খুলে **ইনস্টল** চাপুন। "অজানা উৎস থেকে ইনস্টল করার অনুমতি" চাইলে অনুমতি দিন।
            ৩. আগের ভার্সন থাকলে উপরে নতুনটা ইনস্টল হয়ে যাবে — ডেটা মুছবে না।

            ## ✨ v4.0-এ নতুন (গুরুত্বপূর্ণ সমাধান)
            - 💾 **"ফোনের স্টোরেজে সেভ হয়নি" সমস্যার আসল কারণ ঠিক:** v3.8 থেকে ভেতরের একটি ধ্রুবক (LS_KEY) হারিয়ে গিয়েছিল — প্রতিটি সেভই ভুল ত্রুটি দেখাত; এখন সেভ সত্যিই হয়, সফল হলে সফল-বার্তা, ব্যর্থ হলে সঠিক কারণ
            - 🗄 **নিরাপদ দ্বিস্তর-স্টোরেজ:** ফোনের সাধারণ স্টোরেজ কোনো কারণে ব্লকড হলে তথ্য নিরাপদ বিকল্প স্টোরেজে (IndexedDB) সেভ হয় — অ্যাপ বন্ধ করে খুললে সেখান থেকেই সব ফেরত; পুরোনো কোনো ডেটা মুছে না
            - ☕ **বিরতি সম্পূর্ণ নতুন:** বিরতি-বোতাম → টাইমার ওই মুহূর্তে স্থির → "বিরতির সময় হয়েছে" কণ্ঠ → কণ্ঠ শেষে অটো কাউন্টডাউন → শেষ হলে "বিরতি শেষ… খেলা শুরু করুন" কণ্ঠ → খেলা অটো চালু; সব ফোনে একই সময়
            - 🔊 **তিনটি নিজস্ব কণ্ঠই এখন ঠিকভাবে বাজে:** খেলা শুরু / বিরতি শুরু / বিরতি শেষ / খেলা শেষ — চার ঘটনায় নির্ধারিত কণ্ঠ, কোনো বিট বা বাড়তি সাউন্ড নেই (আগে একটি সময়-হিসাবের বাগের কারণে কণ্ঠের বদলে বিপ বাজত); কর্তৃপক্ষ-প্যানেলে কোন ঘটনায় কোন কণ্ঠ তা বেছে নেওয়া ও শুনে-পরীক্ষার ব্যবস্থা
            - 🧹 **হোম থেকে "ক্লাবে যা যা হলো" সম্পূর্ণ সরানো** — অ্যাডমিনের কাজের তালিকা এখন শুধু পিনে ঢোকা কর্তৃপক্ষ দেখবেন
            - 🔐 **গোপন পিন এখন ঠিক ৬ ডিজিটের** (৪/৫ ডিজিট গ্রহণ হয় না; আগের পিনে প্রবেশ তবু চলবে); রিকভারি পিন ৭২৫৪২ অপরিবর্তিত
            - 🔔 **নোটিফিকেশন আরও নির্ভরযোগ্য:** ক্লাউড থেকে ঘণ্টায় মার্জ + একই খবর দ্বিতীয়বার আসে না + নোটিফিকেশনে চাপ দিলে সঠিক পেজ খোলে; "সবাইকে জানান"-এর ক্লাউড-ওভাররাইট বাগ ঠিক

            ## ⚙️ এডমিনদের জন্য (একবারই)
            - **সবার ফোনে লাইভ ঘড়ি, ক্লাউড সিঙ্ক ও নোটিফিকেশন** চালু করতে: Firebase Console → **Realtime Database → Create Database → Start in test mode** (এডমিন লগইনের আর দরকার নেই — প্রবেশ এখন শুধু গোপন পিন দিয়ে)
            - লাইভ ঘড়ি দেখতে সমস্যা হলে অ্যাপের সহায়িকা (❓) → "লাইভ ঘড়ি চালু করা" অংশে ধাপে ধাপে নির্দেশনা আছে

      - name: APK আর্টিফ্যাক্ট (ব্যাকআপ কপি)
        uses: actions/upload-artifact@v4
        with:
          name: Shobarampur-Sports-Family-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
