name: অ্যাপ বিল্ড ও রিলিজ (APK)

# main ব্রাঞ্চে পুশ করলেই অটো বিল্ড + রিলিজ হবে।
# অথবা Actions ট্যাব → "অ্যাপ বিল্ড ও রিলিজ (APK)" → "Run workflow"।
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "ভার্সন নাম (যেমন: 6.5)"
        required: false
        default: "6.5"

permissions:
  contents: write

jobs:
  build-apk:
    name: APK তৈরি ও GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: অ্যাপের ফাইল প্রস্তুত করুন
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          echo "index.html কপি হয়েছে ($(du -h android/app/src/main/assets/index.html | cut -f1))"

      - name: ফায়ারবেস যাচাই (ঐচ্ছিক)
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "✅ google-services.json পাওয়া গেছে — পুশ নোটিফিকেশন সহ বিল্ড হবে"
          else
            echo "ℹ️ google-services.json নেই — ফায়ারবেস ছাড়া বিল্ড হবে (অ্যাপের ভেতরের সব ফিচার ঠিকই চলবে)"
          fi

      - name: APK বিল্ড (Release, সাইনড)
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PappVersionName="${{ github.event.inputs.version_name || '6.5' }}"
        env:
          # v6.4: প্রতি বিল্ডে রান-নাম্বার → versionCode/versionName আলাদা → MD5 কখনো একই আসবে না
          RUN_NUMBER: ${{ github.run_number }}

      - name: APK ফাইল নামকরণ
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '6.5' }}.apk"
          ls -la out/

      # রিলিজের বিবরণ (নিচের body অংশে প্রতিটি লাইনের আগে ১২টি স্পেস থাকতে হবে)
      - name: GitHub Release তৈরি — লিংক দিলেই সবাই ডাউনলোড করতে পারবে
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version_name || '6.5' }}"
          name: "⚽ Shobarampur Sports Family — v${{ github.event.inputs.version_name || '6.5' }}"
          make_latest: true
          overwrite_files: true
          files: out/*.apk
          body: |
            ## 📱 ডাউনলোড করার নিয়ম
            ১. নিচের **Assets** অংশ থেকে `Shobarampur-Sports-Family-v${{ github.event.inputs.version_name || '6.5' }}.apk` ফাইলটি চাপুন — ডাউনলোড শুরু হবে (কোনো লগইন লাগে না)।
            ২. ফোনে খুলে **ইনস্টল** চাপুন। "অজানা উৎস থেকে ইনস্টল করার অনুমতি" চাইলে অনুমতি দিন।
            ৩. আগের ভার্সন থাকলে উপরে নতুনটা ইনস্টল হয়ে যাবে — ডেটা মুছবে না।

            ## ✨ v6.5-এ নতুন (টোটালি ফ্রেশ — ফিক্সড অ্যান্ড ফাইনাল)
            - 🧹 **প্রথম খুললেই টোটালি ফ্রেশ** — আগের সব নোটিফিকেশন, নোটিশ, টুর্নামেন্ট, হিসাব, লগ মুছে যায়; **সদস্য-তালিকা আর ক্লাব-সেটিংস থাকে**
            - ☁️ **ক্লাউডের পুরনো খবরও পুরো নোড মুছে সাফ** — নতুন ইনস্টল করা ফোনে আগের কোনো খবর আর আসবে না
            - ⚽ **গোলে ক্লিক করলে স্কোর সাথে সাথে বাড়ে এবং নাম্বারটি লাফিয়ে ওঠে** (লাল ফ্ল্যাশ-অ্যানিমেশন)
            - 🔔 **নোটিশ-মুহূর্তে সুন্দর টোস্ট দেখা যায়, প্যানেলের খবরগুলো এনিমেশনে ভেসে ওঠে**
            - ⚡ **সিঙ্ক আরও দ্রুত** — নোটিশ/স্কোর সবার ফোনে প্রায় সাথে সাথে পৌঁছায় (৫-সেকেন্ড চেক)

            ## ⚙️ এডমিনদের জন্য (একবারই)
            - **সবার ফোনে লাইভ ঘড়ি, ক্লাউড সিঙ্ক ও নোটিফিকেশন** চালু করতে: Firebase Console → **Realtime Database → Create Database → Start in test mode** (এডমিন লগইনের আর দরকার নেই — প্রবেশ এখন শুধু গোপন পিন দিয়ে)
            - লাইভ ঘড়ি দেখতে সমস্যা হলে অ্যাপের সহায়িকা (❓) → "লাইভ ঘড়ি চালু করা" অংশে ধাপে ধাপে নির্দেশনা আছে

      - name: APK আর্টিফ্যাক্ট (ব্যাকআপ কপি)
        uses: actions/upload-artifact@v4
        with:
          name: Shobarampur-Sports-Family-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
