name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: রিপোজিটরি ডাউনলোড
        uses: actions/checkout@v4
      - name: Pages কনফিগার
        uses: actions/configure-pages@v5
      - name: সাইট আপলোড (index.html একটিই ফাইল)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: ডিপ্লয়
        id: deployment
        uses: actions/deploy-pages@v4
